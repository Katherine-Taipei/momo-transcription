name: Daily Log Summary

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  summarize:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Log Summarizer
        run: |
          python scripts/summarize_logs.py
